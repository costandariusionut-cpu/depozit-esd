<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depozit ESD</title>
<meta name="theme-color" content="#141416">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Depozit ESD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<style>
:root{color-scheme:dark;--bg:#1b1b1d;--card:#262628;--field:#1e1e20;--ink:#f4ead6;--mut:#a89f91;--line:#3b3b3f;--acc:#ee6a3c;--accbg:rgba(238,106,60,.16);--gold:#f2d9a1;--grad:linear-gradient(135deg,#e8472b 0%,#f08a3c 100%);--ok:#79d99b;--okbg:rgba(60,170,105,.18);--warn:#f6b64f;--warnbg:rgba(246,182,79,.16);--bad:#ff8272;--badbg:rgba(229,72,52,.2)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:0 0 92px}
header.top{position:sticky;top:0;z-index:5;background:#101828;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .who{flex:1;min-width:0}
header.top .who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .who span{font-size:13px;opacity:.75}
header.top button{background:#1f2a44;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:15px;min-height:42px}
main{padding:14px}
h2{margin:6px 0 12px;font-size:22px}
h3{margin:14px 0 8px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.sm{font-size:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:16px;min-height:46px;cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.danger{color:var(--bad);border-color:#f1b9b9}
.btn.small{min-height:38px;padding:6px 11px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border:1px solid #c5ccd6;border-radius:10px;background:#fff;color:var(--ink);min-height:46px}
textarea{min-height:70px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap;cursor:pointer;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:13px;margin:2px 4px 2px 0;background:#eef0f3;color:#33394a}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.acc{background:var(--accbg);color:var(--acc)}
.thumb{width:62px;height:62px;border-radius:10px;object-fit:cover;flex:none;background:#e6e9ee}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .inner{display:flex;width:100%;max-width:760px}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:12px;color:var(--mut);min-height:58px}
nav.bottom button i{display:block;font-style:normal;font-size:22px;line-height:1.2}
nav.bottom button.on{color:var(--acc);font-weight:700}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner.warn{background:var(--warnbg);color:#7a3b05}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.info{background:var(--accbg);color:#173a99}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:18px}
.sh-head .x{border:0;background:#eef0f3;border-radius:10px;width:42px;height:42px;font-size:18px}
.sh-body{padding:14px 16px 22px;overflow:auto}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:42px;height:42px;border:1px solid #c5ccd6;background:#fff;border-radius:10px;font-size:20px}
.qty span{min-width:30px;text-align:center;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#101828;color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;max-width:90vw}
#toast div.bad{background:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:13px;color:var(--mut);padding:2px 0}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:54px;padding:4px;font-size:15px;text-align:left;cursor:pointer}
.cal .d.out{opacity:.35}.cal .d.today{border-color:var(--acc);border-width:2px}.cal .d.sel{background:var(--accbg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.dot.e{background:var(--gold)}.dot.r{background:#ea580c}
.menu button{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;font-size:17px;min-height:58px}
.menu button i{font-style:normal;font-size:24px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .chip{flex:1;text-align:center}
.tot{font-size:20px;font-weight:700}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:24px;height:24px;min-height:0}
.check:last-child{border-bottom:0}
.sw{width:52px;height:30px;min-height:0;appearance:none;-webkit-appearance:none;background:#c5ccd6;border-radius:999px;position:relative;flex:none}
.sw:checked{background:var(--acc)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw:checked::after{left:25px}
.zmap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zn{position:relative;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 10px 10px 40px;min-height:92px;cursor:pointer}
.zn.wide{grid-column:1/-1}
.zn.hi{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 3px rgba(29,78,216,.25)}
.znn{position:absolute;left:9px;top:10px;width:24px;height:24px;border-radius:50%;background:#101828;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#e6e9ee;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:17px}
.av.big{width:84px;height:84px;font-size:32px}.av.sm2{width:32px;height:32px;font-size:13px}
.login{max-width:520px;margin:0 auto;padding:26px 16px}
.login .big{display:block;width:100%;text-align:left;margin-bottom:10px;padding:16px;font-size:19px;border-radius:14px;border:1px solid var(--line);background:#fff;min-height:64px}
.login .big small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
/* ---- temă ESD: fundal cărbune, accent roșu-portocaliu, litere crem (după sigla Stages) ---- */
html,body{background:radial-gradient(900px 420px at 50% -80px,#3b2a22 0%,var(--bg) 62%) fixed,var(--bg)}
h2{color:var(--gold);letter-spacing:.2px}
h3{color:var(--ink)}
header.top{background:#141416;border-bottom:0}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
header.top button{background:#2b2b2e;color:var(--ink);border:1px solid #38383c}
.hlogo{height:44px;width:44px;border-radius:50%;background:#232325;object-fit:contain;flex:none;padding:1px;cursor:pointer;box-shadow:0 0 0 1px rgba(242,217,161,.35)}
.card{box-shadow:0 1px 0 rgba(255,255,255,.03),0 6px 16px rgba(0,0,0,.22)}
.btn{background:#2d2d30;color:var(--ink);border-color:#444449}
.btn.primary{background:var(--grad);border:0;color:#1a0f08;font-weight:700}
.btn.danger{color:var(--bad);border-color:#7a3a34;background:#2d2d30}
input,select,textarea{background:var(--field);border-color:#4a4a4f;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#7f776b}
.chip{background:#2d2d30;color:var(--ink);border-color:#444449}
.chip.on{background:var(--grad);border:0;color:#1a0f08;font-weight:700}
.pill{background:#3a3a3e;color:#e9dfcb}
.pill.acc{color:#ffb98f}
.thumb,.av{background:#3a3a3e}
nav.bottom{background:#141416;border-top:1px solid #2e2e32}
nav.bottom button.on{color:var(--gold)}
nav.bottom button.on i{filter:drop-shadow(0 0 6px rgba(238,106,60,.6))}
.banner.info{background:var(--accbg);color:#f6dfb2;border:1px solid rgba(238,106,60,.25)}
.banner.warn{color:#f8dfa6}
.sheet{background:#262628;border:1px solid #38383c;border-bottom:0}
.sh-head .x{background:#3a3a3e;color:var(--ink)}
.qty button{background:var(--field);color:var(--ink);border-color:#4a4a4f}
#toast div{background:#0e0e0f;color:var(--ink);border:1px solid #444449}
.cal .d{background:var(--card);color:var(--ink)}
.menu button{background:var(--card);color:var(--ink)}
.check input.sw,input.sw{width:54px;height:32px;min-height:0;padding:0;border:0;flex:none;background:#4a4a4f;box-shadow:inset 0 0 0 1px #5a5a60;transition:background .15s}
.check input.sw:checked,input.sw:checked{background:var(--grad);box-shadow:none}
.check input.sw::after,input.sw::after{top:4px;left:4px;width:24px;height:24px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.check input.sw:checked::after,input.sw:checked::after{left:26px}
.zn{background:var(--card)}
.zn.hi{box-shadow:0 0 0 3px rgba(238,106,60,.3)}
.znn{background:var(--gold);color:#1b1b1d;font-weight:700}
.modal{background:rgba(5,5,6,.7)}
/* ecran de intrare */
.login{max-width:440px;padding:30px 18px 40px}
.brand{text-align:center;margin-bottom:22px}
.logoplate{width:220px;height:220px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#2f2f32 0%,#222224 70%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(242,217,161,.35),0 18px 40px rgba(0,0,0,.55),0 0 70px rgba(238,106,60,.22)}
.logoplate img{width:88%;height:88%;object-fit:contain;display:block}
.brandname{font-size:27px;font-weight:800;letter-spacing:.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brandtag{color:var(--mut);font-size:13px;letter-spacing:2.4px;text-transform:uppercase;margin-top:4px}
.loginbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px 18px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.loginbox::before{content:"";display:block;height:3px;border-radius:3px;background:var(--grad);margin:0 -16px 8px;opacity:.9}
.login .big{background:var(--card);color:var(--ink)}
.check input,input[type=checkbox]{accent-color:var(--acc)}
.login-foot{text-align:center;color:var(--mut);font-size:13px;margin-top:16px}

.cst{white-space:nowrap}
.cstd{cursor:pointer;display:inline-block;vertical-align:middle;margin-left:2px}
#cloudgate{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px}
#cloudgate[hidden]{display:none}
#cloudgate .cg{background:var(--card);border:1px solid #3a3a3d;border-radius:16px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
#cloudgate .cg b{font-size:18px;color:var(--gold)}
#cloudgate .cg p{margin:0;font-size:14px;color:var(--mut)}
#cloudgate .cg button{background:var(--grad);color:#1a0f08;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:16px;min-height:46px}
#cloudgate .cg button.alt{background:#34343a;color:var(--ink);font-weight:600}
#cloudgate .cge{color:var(--bad);font-size:14px;min-height:16px}
/* ---- aplicație instalată: zone sigure (notch, bara de jos), fără selecție/zoom accidental ---- */
header.top{padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,.chip,nav.bottom button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,select,textarea{font-size:16px}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}

function days(a,b){return Math.round((parse(b)-parse(a))/86400000)+1;}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(parse(s).getTime());}

/* ---------- disponibilitate (un singur calcul) ---------- */
function totalQ(it){return it.mode==='unit'?it.units.length:it.total;}
function bad(it,st){return it.mode==='unit'?it.units.filter(function(u){return u.state===st;}).length:(st==='Defect'?(it.defect||0):(it.maint||0));}
function usable(it){return it.mode==='unit'?it.units.filter(function(u){return u.state==='Prezent';}).length:Math.max(0,it.total-(it.defect||0)-(it.maint||0));}
function ov(a1,a2,b1,b2){return a1<=b2&&a2>=b1;}
function reserved(itemId,from,to,ex){
  var n=0;ex=ex||{};
  S.rentals.forEach(function(r){if(r.returned||r.id===ex.rental)return;var end=r.to<today()?'9999-12-31':r.to;if(ov(r.from,end,from,to))r.lines.forEach(function(l){if(l.item===itemId)n+=l.qty;});});
  S.events.forEach(function(e){if(e.id===ex.event)return;if(ov(e.from,e.to,from,to))e.lines.forEach(function(l){if(l.item===itemId)n+=l.qty;});});
  return n;
}
function usableP(it,from){
  var n=usable(it),outs=it.outs||[];
  if(it.mode==='unit'){it.units.forEach(function(u){if(u.state!=='Prezent'){var o=outs.filter(function(x){return x.code===u.code;})[0];if(o&&o.until&&o.until<from)n++;}});}
  else{var def=it.defect||0,mt=it.maint||0;outs.forEach(function(o){if(o.until&&o.until<from){var q=Math.min(o.q,o.t==='Defect'?def:mt);if(o.t==='Defect')def-=q;else mt-=q;n+=q;}});}
  return Math.min(n,totalQ(it));
}
function avail(it,from,to,ex){return Math.max(0,usableP(it,from)-reserved(it.id,from,to,ex));}
function blockers(it,from,to,ex){
  ex=ex||{};var L=[];
  S.rentals.forEach(function(r){if(r.returned||r.id===ex.rental)return;var end=r.to<today()?'9999-12-31':r.to;if(!ov(r.from,end,from,to))return;r.lines.forEach(function(l){if(l.item===it.id)L.push({k:'rent',t:'Închiriat: '+((client(r.client)||{}).name||'?'),from:r.from,to:r.to,q:l.qty});});});
  S.events.forEach(function(e){if(e.id===ex.event||!ov(e.from,e.to,from,to))return;e.lines.forEach(function(l){if(l.item===it.id)L.push({k:'ev',t:'Eveniment: '+e.name,from:e.from,to:e.to,q:l.qty});});});
  var outs=it.outs||[];
  if(it.mode==='unit'){it.units.forEach(function(u){if(u.state==='Prezent')return;var o=outs.filter(function(x){return x.code===u.code;})[0];if(o&&o.until&&o.until<from)return;L.push({k:'stare',t:u.state+' ('+u.code+')'+(o&&o.note?': '+o.note:''),from:o?o.from:'',to:o?o.until:'',q:1});});}
  else{var sum=0;outs.forEach(function(o){sum+=o.q;if(o.until&&o.until<from)return;L.push({k:'stare',t:o.t+(o.note?': '+o.note:''),from:o.from,to:o.until,q:o.q});});
    var rem=(it.defect||0)+(it.maint||0)-sum;if(rem>0)L.push({k:'stare',t:'Defect / mentenanță',from:'',to:'',q:rem});}
  L.sort(function(a,b){return (a.from||'0000')<(b.from||'0000')?-1:1;});return L;
}
function blockLine(b){
  var per=b.k==='stare'?(b.to?'până la '+fmtS(b.to)+(b.from?' (din '+fmtS(b.from)+')':''):'fără dată de revenire'):fmtS(b.from)+'–'+fmtS(b.to);
  return '<div class="sm" style="padding:3px 0">• '+esc(b.t)+' · '+b.q+' buc · '+per+'</div>';
}
function blockersHtml(it,from,to,ex){var L=blockers(it,from,to,ex);return L.length?L.map(blockLine).join(''):'<div class="mut">Nimic: este liber în perioada aceasta.</div>';}

function shortages(){
  var t=today(),dd={},out=[];
  function add(id,from,to){if(to<t)return;var f=from<t?t:from;(dd[id]=dd[id]||{})[f]=1;}
  S.events.forEach(function(e){(e.lines||[]).forEach(function(l){add(l.item,e.from,e.to);});});
  S.rentals.forEach(function(r){if(!r.returned)(r.lines||[]).forEach(function(l){add(l.item,r.from,r.to<t?'9999-12-31':r.to);});});
  Object.keys(dd).forEach(function(id){var it=item(id);if(!it)return;var w=null;
    Object.keys(dd[id]).sort().forEach(function(d){var miss=reserved(id,d,d)-usableP(it,d);if(miss>0&&(!w||miss>w.miss))w={it:it,day:d,miss:miss};});
    if(w)out.push(w);});
  return out;
}

function calView(){
  var now=new Date();if(!UI.calY){UI.calY=now.getFullYear();UI.calM=now.getMonth();}
  if(!UI.calDay)UI.calDay=today();
  var y=UI.calY,m=UI.calM;var first=new Date(y,m,1);var off=(first.getDay()+6)%7;var dim=new Date(y,m+1,0).getDate();
  var h='<h2>Calendar</h2><div class="row" style="margin-bottom:10px"><button class="btn small" onclick="A.calNav(-1)">‹</button><div class="grow" style="text-align:center"><b>'+MONTHS[m]+' '+y+'</b></div><button class="btn small" onclick="A.calNav(1)">›</button></div><div class="cal">';
  ['L','M','M','J','V','S','D'].forEach(function(x){h+='<div class="dh">'+x+'</div>';});
  for(var i=0;i<off;i++)h+='<div></div>';

  }

  h+='<button class="btn primary block" onclick="A.evForm(null,\''+ds2+'\')">+ Eveniment în această zi</button>';

function payView(){
  var evs=S.events.slice().sort(function(a,b){return a.from<b.from?1:-1;});

  if(orph.length){var os=0;orph.forEach(function(y){os+=y.sum;});h+='<div class="banner warn">'+orph.length+' plăți ('+money(os)+') au rămas de la evenimente șterse. <button class="btn small" style="margin-top:6px" onclick="A.payOrph()">Șterge-le</button></div>';}

  var rows=S.payments.filter(function(y){return y.event===UI.payEv;});

  h+='<h3>Plăți la acest eveniment</h3>';

  h+='<div class="card sm">Total: <b>'+money(tot)+'</b> · plătit '+money(pd)+' · rămas <b>'+money(tot-pd)+'</b></div>';

function payTotals(){
  var byP={},byM={};
  S.payments.forEach(function(y){var e=evt(y.event);var a=byP[y.person]=byP[y.person]||{t:0,u:0};a.t+=y.sum;if(!y.paid)a.u+=y.sum;var m=e&&validDate(e.from)?e.from.slice(0,7):'';var b=byM[m]=byM[m]||{t:0,u:0};b.t+=y.sum;if(!y.paid)b.u+=y.sum;});

  var hp=Object.keys(byP).sort(function(a,b){return byP[b].u-byP[a].u;}).map(function(p){return line(pname(p),byP[p]);}).join('');
  var hm=Object.keys(byM).sort().reverse().map(function(m){return line(m?MONTHS[+m.slice(5)-1]+' '+m.slice(0,4):'Eveniment șters',byM[m]);}).join('');

    status=s;var i,l=document.querySelectorAll('.cst');for(i=0;i<l.length;i++)l[i].innerHTML=pill();
    l=document.querySelectorAll('.cstd');for(i=0;i<l.length;i++)l[i].innerHTML=dot();
    var b=document.getElementById('cstb');if(b)b.innerHTML=banner();
  }

  /* ---- fereastra de conectare a dispozitivului ---- */
  function box(html){
    var d=document.getElementById('cloudgate');
    if(!d){d=document.createElement('div');d.id='cloudgate';document.body.appendChild(d);}
    d.innerHTML='<div class="cg">'+html+'</div>';d.hidden=false;return d;
  }
  function hideBox(){var d=document.getElementById('cloudgate');if(d)d.hidden=true;}
  function showGate(msg){
    if(!T&&!/^https?:$/.test(location.protocol)){
      box('<b>Date comune (online)</b><p>Acesta este fișierul demo, deschis de pe calculator: datele rămân doar aici. Datele comune ale echipei se folosesc din aplicația de la adresa de internet (cea instalată pe telefon).</p><button id="cgskip" class="alt">Închide</button>');
      document.getElementById('cgskip').onclick=hideBox;return;
    }
    var has=linked();
    var d=box('<b>'+(has?'Date comune (online)':'Conectează dispozitivul la datele echipei')+'</b>'+
      (has?'<p>Stare: <span class="cst">'+pill()+'</span>'+(lastErr&&status!=='ok'?'<br><span style="opacity:.7">'+esc(lastErr).slice(0,160)+'</span>':'')+'</p><p>Dispozitivul este conectat la datele comune. Orice salvezi ajunge la toată echipa.</p>'
          :'<p>Introdu codul de echipă, o singură dată pe acest dispozitiv. Apoi intri cu numele și parola ta; datele sunt comune și modificările apar la toți în câteva secunde.</p><input id="cgcode" type="password" autocomplete="off" autocapitalize="off" placeholder="Cod de echipă">')+
      '<div class="cge">'+esc(msg||'')+'</div>'+
      (has?'<button id="cgsync">Sincronizează acum</button><button id="cgskip" class="alt">Închide</button><button id="cgout" class="alt">Deconectează acest dispozitiv</button>'
          :'<button id="cgok">Conectează</button><button id="cgskip" class="alt">Mod demo, doar pe acest dispozitiv</button>'));
    var inp=document.getElementById('cgcode'),ok=document.getElementById('cgok'),sy=document.getElementById('cgsync'),o=document.getElementById('cgout');
    if(ok)ok.onclick=function(){var v=inp.value.trim();if(!v)return;connect(v,true);};
    if(inp)inp.onkeydown=function(ev){if(ev.key==='Enter')ok.click();};
    if(sy)sy.onclick=function(){hideBox();if(ready)reconcile();else if(status==='login')showGate('Intră cu numele și parola ta ca să sincronizezi.');else connect(ls(CODEK));};
    document.getElementById('cgskip').onclick=function(){hideBox();};
    if(o)o.onclick=function(){
      box('<b>Deconectezi dispozitivul?</b><p>Datele comune rămân la echipă. De pe acest dispozitiv se șterge copia locală și aplicația revine la datele de exemplu.</p><button id="cgyes">Da, deconectează</button><button id="cgno" class="alt">Renunță</button>');
      document.getElementById('cgno').onclick=function(){hideBox();};
      document.getElementById('cgyes').onclick=unlink;
    };
  }
  function unlink(){
    ready=false;clearTimeout(pushT);clearTimeout(retryT);
    try{if(ch&&sb)sb.removeChannel(ch);}catch(e){}
    try{if(sb)sb.auth.signOut();}catch(e){}
    try{[CODEK,SYNCK,PULLK,KEY,SESSK,PEOPLEK,OFFK,'esd-auth'].forEach(function(k){localStorage.removeItem(k);});}catch(e){}
    ch=null;SYNCED={};lastPull='';hideBox();
    if(T){setStatus('local');return;}
    location.reload();
  }

  function loadLib(){
    return new Promise(function(res,rej){
      if(T&&T.supabase)window.supabase=T.supabase;
      if(window.supabase&&window.supabase.createClient)return res();
      var s=document.createElement('script');s.src=LIB_URL;s.integrity=LIB_SRI;s.crossOrigin='anonymous';
      s.onload=function(){res();};s.onerror=function(){s.remove();rej(new Error('Biblioteca de sincronizare nu s-a putut încărca'));};
      document.head.appendChild(s);
    });
  }

  function client(){
    if(!sb){
      sb=window.supabase.createClient(URL_,KEYP,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'esd-auth',detectSessionInUrl:false}});
    }
    if(!authHooked&&sb.auth.onAuthStateChange){authHooked=true;
      sb.auth.onAuthStateChange(function(ev){
        if(ev!=='SIGNED_OUT')return;
        ready=false;try{if(ch)sb.removeChannel(ch);}catch(e){}ch=null;lss(SESSK,null);setStatus('login');
        if(UI.me){try{toast('Sesiunea s-a încheiat (parolă schimbată sau cont oprit). Intră din nou.',true);}catch(e){}UI.me=null;UI.profile=null;try{closeModal();render();}catch(e){}}
      });
    }
    return sb;
  }
  async function refreshPeople(code){
    var r=await sb.rpc('esd_people',{p_code:code});
    if(r.error)throw r.error;
    if(!r.data||!r.data.ok)return false;
    lss(PEOPLEK,r.data.people||[]);return true;
  }

  /* ---- legarea dispozitivului: doar verifică codul de echipă ---- */
  async function connect(code,fromGate){
    if(connecting||!code)return false;connecting=true;setStatus('conn');
    if(fromGate)box('<b>Se conectează…</b><p>Se verifică codul de echipă.</p>');
    try{
      await loadLib();client();
      var ok=await refreshPeople(code);
      if(!ok){
        try{localStorage.removeItem(CODEK);}catch(e){}
        connecting=false;ready=false;setStatus('local');showGate(fromGate?'Cod greșit. Încearcă din nou.':'Codul de echipă s-a schimbat. Cere-l de la administrator.');return false;
      }
      if(ls(CODEK)!==code){try{localStorage.setItem(CODEK,code);}catch(e){}lss(SYNCK,null);lss(PULLK,null);S.linked=false;saveLocal();}
      connecting=false;lastErr='';hideBox();
      var g=await sb.auth.getSession(),se=sess();
      if(g&&g.data&&g.data.session&&se&&se.uid===g.data.session.user.id)await startSync(false);
      else{ready=false;setStatus('login');}
      if(!UI.me){try{render();}catch(e){}}
      return true;
    }catch(e){
      connecting=false;ready=false;lastErr=String((e&&e.message)||e);setStatus('off');
      if(fromGate)showGate('Nu am putut face legătura. Verifică internetul și încearcă din nou.');else hideBox();
      clearTimeout(retryT);retryT=setTimeout(function(){var c=ls(CODEK);if(c)connect(c);},12000);
      return false;
    }
  }

  /* ---- sincronizarea, pentru contul conectat ---- */
  async function startSync(whole){
    var se=sess();
    var first=whole||!ls(SYNCK)||!S.linked;
    KEEP=null;
    if(first&&S.linked&&ls(SYNCK)){ /* schimbare de cont: ce s-a modificat local și nu a plecat încă nu se pierde */
      var old={};try{old=JSON.parse(ls(SYNCK))||{};}catch(e){}var lm=localMap();KEEP={};
      Object.keys(lm).forEach(function(k){var c=k.split('|')[0];if(!SERVER_ONLY[c]&&old[k]!==hs(canon(lm[k])))KEEP[k]=1;});
    }
    if(first){SYNCED={};lastPull='';box('<b>Se încarcă datele echipei…</b><p>Durează câteva secunde.</p>');}
    else{try{SYNCED=JSON.parse(ls(SYNCK))||{};}catch(e){SYNCED={};}lastPull=ls(PULLK)||'';}
    try{
      try{await pull(first);}finally{KEEP=null;}
      if(first){S.linked=true;S.v=SCHEMA;try{LAST=snap();}catch(e){}if(!saveLocal())throw new Error('Nu pot salva datele pe dispozitiv (memorie plină?)');persist();try{render();}catch(e){}}
      ready=true;
      if(ch){try{sb.removeChannel(ch);}catch(e){}}
      ch=sb.channel('records-live-'+(se?se.acc:'x')).on('postgres_changes',{event:'*',schema:'public',table:'records'},function(p){
        var row=p&&p.new;if(!row||!row.collection)return;
        if(applyRow(row,false)){if(saveLocal())persist();softRender();}
      }).subscribe(function(st){
        if(st==='SUBSCRIBED'){reconcile();}
        else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){if(ready&&status==='ok')setStatus('off');}
      });
      await push();
      if(status!=='err')setStatus('ok');
      hideBox();
    }catch(e){
      hideBox();ready=false;lastErr=String((e&&e.message)||e);setStatus('off');
      clearTimeout(retryT);retryT=setTimeout(function(){var c=ls(CODEK);if(c)connect(c);},12000);
    }
  }

  /* ---- intrarea cu parola: serverul găsește contul după parolă ---- */
  async function offVerify(pid,pw){var o=lsj(OFFK)||{},h=pwHash('OFF|'+pid+'|'+pw);return (o[pid]||[]).filter(function(x){return x.h===h;})[0]||null;}
  function offSave(pid,pw,role,acc){var o=lsj(OFFK)||{},h=pwHash('OFF|'+pid+'|'+pw);o[pid]=(o[pid]||[]).filter(function(x){return x.acc!==acc;});o[pid].push({h:h,role:role,acc:acc});lss(OFFK,o);}
  async function offlineLogin(pid,pw){
    var v=await offVerify(pid,pw);
    if(!v)return {ok:false,why:'net'};
    var se=sess();if(!se||se.acc!==v.acc){ready=false;setStatus('login');}
    return {ok:true,role:v.role,offline:true};
  }
  async function login(pid,pw){
    var code=ls(CODEK);if(!code)return {ok:false,why:'code'};
    try{await loadLib();client();}catch(e){return offlineLogin(pid,pw);}
    var r;try{r=await sb.rpc('esd_resolve',{p_code:code,p_person:pid,p_password:pw});}catch(e){r={error:e};}
    if(r.error)return offlineLogin(pid,pw);
    var res=r.data||{};
    if(!res.ok){
      if(res.why==='code'){try{localStorage.removeItem(CODEK);}catch(e){}showGate('Codul de echipă s-a schimbat. Cere-l de la administrator.');}
      return {ok:false,why:res.why||'bad'};
    }
    var se=sess(),g=await sb.auth.getSession(),cur=g&&g.data&&g.data.session;
    if(!(cur&&se&&se.acc===res.account&&se.uid===cur.user.id)){
      if(ready&&se&&actor===se.person){try{await push();}catch(e){}}
      ready=false;try{if(ch)sb.removeChannel(ch);}catch(e){}ch=null;
      var a=await sb.auth.signInWithPassword({email:res.email,password:code+':'+pw});
      if(a.error)return {ok:false,why:'server',m:a.error.message};
      var uid=a.data&&a.data.user?a.data.user.id:(a.data&&a.data.session?a.data.session.user.id:'');
      var changed=!se||se.uid!==uid;
      lss(SESSK,{acc:res.account,uid:uid,person:pid,role:res.role});
      offSave(pid,pw,res.role,res.account);actor=pid;
      await startSync(changed);
    }else{offSave(pid,pw,res.role,res.account);actor=pid;if(!ready)await startSync(false);}
    try{refreshPeople(code);}catch(e){}
    return {ok:true,role:res.role};
  }

  /* ---- administrarea conturilor (doar Administrator, verificat de server) ---- */
  async function admin(fn,args){
    if(!sb||!ready)return {ok:false,why:'net'};
    var r=await sb.rpc(fn,args);
    if(r.error)return {ok:false,why:'err',m:r.error.message};
    if(r.data&&r.data.ok)await reconcile();
    return r.data||{ok:false};
  }
  function secret(pw){return (ls(CODEK)||'')+':'+pw;}

  function start(){
    if(started)return;started=true;setStatus('local');
    if(!T&&!/^https?:$/.test(location.protocol))return;
    var code=ls(CODEK);
    if(code)connect(code);else if(!T||T.gate)showGate('');
    actor=(sess()||{}).person||null;
    window.addEventListener('online',function(){var c=ls(CODEK);if(c&&!ready&&status!=='login')connect(c);else reconcile();});
    document.addEventListener('visibilitychange',function(){if(!document.hidden){var c=ls(CODEK);if(c&&!ready&&status!=='login')connect(c);else reconcile();}});
    /* plasă de siguranță: chiar dacă legătura live cade, datele se aliniază la fiecare 25 de secunde */
    setInterval(function(){if(!document.hidden)reconcile();},T?T.poll||600000:25000);
  }
  return {start:start,queue:queue,push:push,pull:pull,reconcile:reconcile,connect:connect,login:login,people:people,open:function(){showGate('');},pill:pill,dot:dot,banner:banner,linked:linked,validRow:validRow,applyRow:applyRow,
    adminCreate:function(pid,role,pw){return admin('esd_admin_create',{p_person:pid,p_role:role,p_secret:secret(pw)});},
    adminPassword:function(acc,pw){return admin('esd_admin_password',{p_account:acc,p_secret:secret(pw)});},
    adminEnable:function(acc,on){return admin('esd_admin_enable',{p_account:acc,p_on:on});},
    adminDelete:function(acc){return admin('esd_admin_delete',{p_account:acc});},
    get session(){return sess();},
    get status(){return status;},get ready(){return ready;},get synced(){return SYNCED;},canon:canon,hs:hs};
})();
load();LAST=snap();render();try{CLOUD.start();}catch(e){}
window.__esd={cloud:CLOUD,save:function(){save();},shortages:shortages,reload:function(){load();LAST=snap();render();},get state(){return S;},avail:avail,seed:seed,UI:UI,as:function(pid,role){UI.me=pid;UI.profile=role;UI.tab='inv';UI.more='';LAST=snap();render();},sha:sha256,blockers:blockers};
})();
</script>
<script>
(function(){
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    var had=!!navigator.serviceWorker.controller;
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
    /* versiune nouă instalată: dacă omul e pe ecranul de intrare, o aplicăm pe loc */
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!had){had=true;return;}
      try{if(!window.__esd||!window.__esd.UI.profile)location.reload();}catch(e){}
    });
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
</script>
